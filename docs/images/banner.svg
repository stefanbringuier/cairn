    <path d="M215 141c-14-4-14-15-5-23 12-11 54-13 66-3 12 9 6 21-3 25-13 5-43 6-58 1Z" opacity=".8"/>
    <path d="M228 105c-9-4-9-15-2-23 6-8 19-10 29-5 12 7 16 19 7 25-8 5-24 7-34 3Z" opacity=".7"/>
  </g>
  <text x="365" y="170" fill="#e0af68" font-family="Verdana, sans-serif" font-size="100" font-weight="700" letter-spacing="-5">cairn</text>
  <text x="372" y="207" fill="#a9b1cc" font-family="Verdana, sans-serif" font-size="21" letter-spacing="2">A WAY BACK TO YOUR FILES</text>
  <text x="374" y="238" fill="#7f8c98" font-family="Verdana, sans-serif" font-size="16" letter-spacing="1">with restic as your trail</text>

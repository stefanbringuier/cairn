      <stop stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#10131d"/>
    </linearGradient>
    <linearGradient id="stone" x2="0.8" y2="1">
      <stop stop-color="#f4d398"/>
      <stop offset="1" stop-color="#c99550"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#e0af68" stop-opacity=".12"/>
      <stop offset="1" stop-color="#e0af68" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#background)"/>
  <ellipse cx="340" cy="140" rx="310" ry="220" fill="url(#glow)"/>

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  public:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch new advisories in dependencies (we don't take Dependabot PRs)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make tidy-check vet test build
      - name: Installer with isolated release fixtures
        run: |
          sh -n scripts/install.sh
          python3 scripts/test-install.py
      - name: pinned restic download still matches its hash
        run: CAIRN_NET_TEST=1 go test -run TestFetchRestic ./...
      - name: Real restore integration (isolated repository and scheduler)
        env:
          CAIRN_RCLONE_TEST: "1"
        run: make integration
      - name: Static Linux cross-builds
        run: make cross-check
      - name: Binary startup across distributions
        run: python3 scripts/linux-smoke.py bin/cairn

  arm64:
    if: '!github.event.repository.private'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make tidy-check vet test build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: formatting
        run: make fmt-check GOLANGCI_LINT=golangci-lint
      - name: govulncheck
        run: make vuln
      - name: GitHub Actions syntax and shell checks
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Release versions and rerun protection
        run: |
          go install github.com/caarlos0/svu/v3@v3.4.1
          python3 scripts/test-release.py "$(go env GOPATH)/bin/svu"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: check

  commits:
    # Keep contributor authorship; GitHub squash merges use GitHub as committer.
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: check commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.sha) || github.sha) }}
          NAME: Stefan Bringuier
          EMAIL: stefanbringuier@gmail.com
          CHECK_IDENTITY: ${{ github.event_name == 'push' }}
          CHECK_PR: ${{ github.event_name == 'pull_request' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          if [ "$CHECK_PR" = true ]; then
            if ! printf '%s\n' "$PR_TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: .+'; then
              echo "::error::PR title must be a Conventional Commit subject for the squash merge"; fail=1
            fi
            if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eiq 'co-authored-by|claude|generated with'; then
              echo "::error::PR title/body carries an attribution trailer or AI mention"; fail=1
            fi
          fi
          for c in $(git rev-list "$RANGE"); do
            committer="$(git log -1 --format='%cn <%ce>' "$c")"
            if [ "$CHECK_IDENTITY" = true ] && [ "$committer" != "$NAME <$EMAIL>" ] && [ "$committer" != 'GitHub <noreply@github.com>' ]; then
              echo "::error::$c committer is '$committer', expected maintainer or GitHub squash merge"; fail=1
            fi
            if ! git log -1 --format=%s "$c" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: .+'; then
              echo "::error::$c subject isn't a conventional commit: $(git log -1 --format=%s "$c")"; fail=1
            fi
            if [ "$CHECK_IDENTITY" = true ] && git log -1 --format=%B "$c" | grep -Eiq 'co-authored-by|claude|generated with'; then
              echo "::error::$c message carries an attribution trailer or AI mention"; fail=1
            fi
          done
          exit $fail

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: make docs-tools docs

  pr-docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Documentation belongs with code
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-pr-docs.py "$BASE" "$HEAD"

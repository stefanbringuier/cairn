name: release

# Successful main CI cuts a release: patch by default, feat → minor, breaking → major.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to retry publishing
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, publish the release
      actions: read # verify successful main CI for manual retries
      id-token: write # build provenance (public repos)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # svu reads every tag and commit since the last one
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate release commit or retry tag
        id: commit
        env:
          RETRY_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$RETRY_TAG" ]; then
            if ! [[ "$RETRY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Use an existing vX.Y.Z release tag"; exit 1
            fi
            git checkout --detach "refs/tags/$RETRY_TAG"
            git merge-base --is-ancestor HEAD origin/main
          else
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Skipping obsolete CI result; main has advanced."
              exit 0
            fi
          fi
          tested_sha="$(git rev-parse HEAD)"
          conclusion="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$tested_sha" -f branch=main -f event=push \
            --jq '.workflow_runs | sort_by(.updated_at) | last | .conclusion')"
          if [ "$conclusion" != success ]; then
            echo "::error::The latest main-branch CI for this commit must pass before publication"; exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Verify retry code before publication
        if: steps.commit.outputs.ready && github.event_name == 'workflow_dispatch'
        run: |
          if [ -f Makefile ]; then
            make tools check vet
          else
            # Older release tags predate the development Makefile.
            go test -race ./...
            go vet ./...
            go mod tidy -diff
          fi
      - name: next version
        id: version
        if: steps.commit.outputs.ready
        env:
          RETRY_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RETRY_TAG" ]; then
            echo "tag=$RETRY_TAG" >> "$GITHUB_OUTPUT"; exit 0
          fi
          go install github.com/caarlos0/svu/v3@v3.4.1
          next="$(sh scripts/next-release.sh "$(go env GOPATH)/bin/svu")"
          if [ -n "$next" ]; then
            echo "Next release: $next"
            echo "tag=$next" >> "$GITHUB_OUTPUT"
          else
            echo "This commit already has a release tag."
          fi
      - name: tag
        if: steps.version.outputs.tag && github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: | # lightweight tag: no tagger identity, nothing committed to main
          git tag "$TAG"
          git push origin "$TAG"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: steps.version.outputs.tag
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.tag && !github.event.repository.private
        with:
          subject-path: dist/*.tar.gz

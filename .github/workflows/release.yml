name: release

# Every push to main (a merged PR) cuts a release if its commits ask for one:
# fix → patch, feat → minor, feat!/fix!/BREAKING CHANGE → major; docs/chore/ci/... → nothing.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, publish the release
      id-token: write # build provenance (public repos)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # svu reads every tag and commit since the last one
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: next version
        id: version
        run: |
          go install github.com/caarlos0/svu/v3@v3.4.1
          current="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo none)"
          next="$("$(go env GOPATH)/bin/svu" next)"
          echo "current=$current next=$next"
          if [ "$next" != "$current" ] && [ "$next" != "v0.0.0" ]; then echo "tag=$next" >> "$GITHUB_OUTPUT"; fi
      - name: tag
        if: steps.version.outputs.tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: | # lightweight tag: no tagger identity, nothing committed to main
          git tag "$TAG"
          git push origin "$TAG"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: steps.version.outputs.tag
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.tag && !github.event.repository.private
        with:
          subject-path: dist/*.tar.gz

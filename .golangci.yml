version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
    - bodyclose
    - misspell
    - modernize
    - nilerr
    - unconvert
    - nolintlint
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck owns this, with the exclusions below
        - G204 # subprocesses with variable args: wrapping restic/systemctl is the point; repo-supplied values come after "--"
        - G703 # path "traversal": reading/writing user-chosen paths is what a backup tool does
    errcheck:
      exclude-functions:
        - os.Remove # best-effort cleanup
        - os.Setenv
        - (*os.File).Close
        - (io.Closer).Close
        - charm.land/lipgloss/v2.Println # terminal output
        - charm.land/lipgloss/v2.Fprintln

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/stefanbringuier/cairn

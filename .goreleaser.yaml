version: 2
project_name: cairn

builds:
  - main: ./cmd/cairn
    env: [CGO_ENABLED=0]
    goos: [linux] # systemd user timers + flock: Linux only
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}" # stable names: releases/latest/download/... works
    files: [README.md, CONTRIBUTING.md, AGENTS.md, LICENSE, docs/*.md, docs/images/*]

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  groups:
    - title: Breaking changes
      regexp: '^.*?\w+(\(.+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))?:.+$'
      order: 1
    - title: Fixes
      regexp: '^.*?fix(\(.+\))?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude: ['^docs', '^test', '^ci', '^chore', '^style']

release:
  github:
    owner: stefanbringuier
    name: cairn
  footer: |
    **Install or update** (Linux amd64 and arm64):
    ```sh
    curl -fsSL https://raw.githubusercontent.com/stefanbringuier/cairn/main/scripts/install.sh | CAIRN_VERSION={{ .Tag }} sh
    ```
    The installer verifies SHA-256 and replaces only the binary; settings and backups stay in place.
    To update to the latest release later, rerun without `CAIRN_VERSION`.
    Public release archives also support `gh attestation verify <archive> -R stefanbringuier/cairn`.
